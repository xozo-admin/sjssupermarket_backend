services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    volumes: [".:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    ports: ["5432:5432"]
    volumes: ["grocery_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grocery"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@grocery.local
      PGADMIN_DEFAULT_PASSWORD: "12345"
    ports: ["5050:80"]
    depends_on: [postgres]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  grocery_postgres_data:
