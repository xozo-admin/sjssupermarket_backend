[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "boto3>=1.35,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "celery[redis]>=5.4,<6.0",
  "firebase-admin>=7.0,<8.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["docker*", "migrations*", "scripts*"]
